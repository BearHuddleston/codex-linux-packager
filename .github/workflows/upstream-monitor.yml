name: Upstream monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  inspect:
    name: Compare feed, contract, candidate, and public release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Inspect official upstream
        id: status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status_json="${RUNNER_TEMP}/upstream-status.json"
          cargo run --locked -- check-upstream >"${status_json}"
          jq -e '
            .schema == 1 and
            .producer == "io.github.bearhuddleston.codex-linux-packager.rust" and
            .kind == "upstream_status" and
            (.action == "current" or
             .action == "review_contract_update" or
             .action == "rebuild_candidate") and
            (.latest_release.version | test("^[0-9]+([.][0-9]+)+$")) and
            (.latest_release.build | test("^[0-9]+$"))
          ' "${status_json}" >/dev/null
          action="$(jq -r '.action' "${status_json}")"
          version="$(jq -r '.latest_release.version' "${status_json}")"
          build="$(jq -r '.latest_release.build' "${status_json}")"
          release_tag="codex-app-${version}-${build}"
          release_exists=false
          if gh release view "${release_tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json isDraft,isPrerelease,tagName \
            --jq '(.tagName == "'"${release_tag}"'") and
                  (.isDraft == false) and
                  (.isPrerelease == false)' |
            grep -qx true
          then
            release_exists=true
          fi
          {
            printf 'action=%s\n' "${action}"
            printf 'version=%s\n' "${version}"
            printf 'build=%s\n' "${build}"
            printf 'feed_sha256=%s\n' "$(jq -r '.feed_sha256' "${status_json}")"
            printf 'release_tag=%s\n' "${release_tag}"
            printf 'release_exists=%s\n' "${release_exists}"
          } >>"${GITHUB_OUTPUT}"

      - name: Record monitor result
        run: |
          {
            printf '### Codex automatic release monitor\n\n'
            printf -- '- Action: `%s`\n' '${{ steps.status.outputs.action }}'
            printf -- '- Latest application: `%s` build `%s`\n' \
              '${{ steps.status.outputs.version }}' \
              '${{ steps.status.outputs.build }}'
            printf -- '- Feed SHA-256: `%s`\n' '${{ steps.status.outputs.feed_sha256 }}'
            printf -- '- Public release exists: `%s`\n' \
              '${{ steps.status.outputs.release_exists }}'
            printf -- '- Automatic release enabled: `%s`\n' \
              '${{ vars.AUTOMATIC_RELEASE_ENABLED }}'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Create or update the automatic-release issue
        if: >-
          steps.status.outputs.action != 'current' ||
          steps.status.outputs.release_exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.status.outputs.action }}
          VERSION: ${{ steps.status.outputs.version }}
          BUILD: ${{ steps.status.outputs.build }}
          FEED_SHA256: ${{ steps.status.outputs.feed_sha256 }}
          RELEASE_EXISTS: ${{ steps.status.outputs.release_exists }}
          AUTOMATIC_RELEASE_ENABLED: ${{ vars.AUTOMATIC_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          gh label create upstream-update \
            --repo "${GITHUB_REPOSITORY}" \
            --color d93f0b \
            --description "Official Codex feed requires automatic packaging action" \
            --force
          title="[upstream] Codex ${VERSION} build ${BUILD}"
          body_file="${RUNNER_TEMP}/upstream-issue.md"
          {
            printf 'The hourly exact-origin HTTPS monitor reports `%s`.\n\n' "${ACTION}"
            printf -- '- Version: `%s`\n' "${VERSION}"
            printf -- '- Build: `%s`\n' "${BUILD}"
            printf -- '- Feed SHA-256: `%s`\n' "${FEED_SHA256}"
            printf -- '- Matching public release exists: `%s`\n' "${RELEASE_EXISTS}"
            printf -- '- Automatic release enabled: `%s`\n\n' \
              "${AUTOMATIC_RELEASE_ENABLED:-false}"
            if [[ "${ACTION}" == "review_contract_update" ]]; then
              printf '%s\n' \
                'Automation will authenticate the new artifact and refresh only a compatible Electron/native contract. Incompatible changes fail closed.'
            elif [[ "${RELEASE_EXISTS}" != "true" ]]; then
              printf '%s\n' \
                'The contract is current but the public release is absent. Automation will perform a fresh full rebuild before publication.'
            else
              printf '%s\n' \
                'The contract is current and the recorded candidate is stale. Automation will perform a fresh full rebuild.'
            fi
            printf '\n%s\n' \
              'Published output is an unofficial automatic engineering release, not stable support or OpenAI affiliation.'
          } >"${body_file}"
          issue_number="$(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --label upstream-update \
              --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" |
              head -n 1
          )"
          if [[ -n "${issue_number}" ]]; then
            gh issue edit "${issue_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --body-file "${body_file}"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --body-file "${body_file}" \
              --label upstream-update
          fi

      - name: Close resolved upstream issues
        if: >-
          steps.status.outputs.action == 'current' &&
          steps.status.outputs.release_exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label upstream-update \
            --json number \
            --jq '.[].number' |
          while IFS= read -r issue_number; do
            [[ -z "${issue_number}" ]] && continue
            gh issue close "${issue_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment "Resolved: feed, authenticated contract, rebuilt candidate, and public automatic engineering release agree."
          done

      - name: Dispatch the required automatic action
        if: vars.AUTOMATIC_RELEASE_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.status.outputs.action }}
          VERSION: ${{ steps.status.outputs.version }}
          BUILD: ${{ steps.status.outputs.build }}
          RELEASE_EXISTS: ${{ steps.status.outputs.release_exists }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          active=0
          for workflow in \
            refresh-contract.yml \
            rebuild-candidate.yml \
            release-draft.yml
          do
            count="$(
              gh run list \
                --repo "${GITHUB_REPOSITORY}" \
                --workflow "${workflow}" \
                --limit 30 \
                --json status \
                --jq '[.[] | select(.status == "queued" or
                                   .status == "in_progress" or
                                   .status == "waiting" or
                                   .status == "pending")] | length'
            )"
            active=$((active + count))
          done
          if (( active != 0 )); then
            exit 0
          fi

          if [[ "${ACTION}" == "review_contract_update" ]]; then
            gh workflow run refresh-contract.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${DEFAULT_BRANCH}" \
              --field "version=${VERSION}" \
              --field "build=${BUILD}"
          elif [[ "${ACTION}" == "rebuild_candidate" ]]; then
            gh workflow run rebuild-candidate.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${DEFAULT_BRANCH}" \
              --field "version=${VERSION}" \
              --field "build=${BUILD}" \
              --field "reason=stale_candidate"
          elif [[ "${ACTION}" == "current" && "${RELEASE_EXISTS}" != "true" ]]; then
            gh workflow run rebuild-candidate.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${DEFAULT_BRANCH}" \
              --field "version=${VERSION}" \
              --field "build=${BUILD}" \
              --field "reason=missing_release"
          fi
