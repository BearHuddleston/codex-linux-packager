name: Upstream monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: upstream-monitor
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  inspect:
    name: Compare feed, contract, and candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      action: ${{ steps.status.outputs.action }}
      version: ${{ steps.status.outputs.version }}
      build: ${{ steps.status.outputs.build }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Inspect official upstream
        id: status
        run: |
          set -euo pipefail
          status_json="${RUNNER_TEMP}/upstream-status.json"
          cargo run --locked -- check-upstream >"${status_json}"
          jq -e '
            .schema == 1 and
            .producer == "io.github.bearhuddleston.codex-linux-packager.rust" and
            .kind == "upstream_status" and
            (.action == "current" or
             .action == "review_contract_update" or
             .action == "rebuild_candidate") and
            (.latest_release.version | test("^[0-9]+([.][0-9]+)+$")) and
            (.latest_release.build | test("^[0-9]+$"))
          ' "${status_json}" >/dev/null
          {
            printf 'action=%s\n' "$(jq -r '.action' "${status_json}")"
            printf 'version=%s\n' "$(jq -r '.latest_release.version' "${status_json}")"
            printf 'build=%s\n' "$(jq -r '.latest_release.build' "${status_json}")"
            printf 'feed_sha256=%s\n' "$(jq -r '.feed_sha256' "${status_json}")"
          } >>"${GITHUB_OUTPUT}"

      - name: Record monitor result
        run: |
          {
            printf '### Codex upstream monitor\n\n'
            printf -- '- Action: `%s`\n' '${{ steps.status.outputs.action }}'
            printf -- '- Latest application: `%s` build `%s`\n' \
              '${{ steps.status.outputs.version }}' \
              '${{ steps.status.outputs.build }}'
            printf -- '- Feed SHA-256: `%s`\n' '${{ steps.status.outputs.feed_sha256 }}'
            printf -- '- Trusted rebuild enabled: `%s`\n' \
              '${{ vars.TRUSTED_REBUILD_ENABLED }}'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Create or update the upstream action issue
        if: steps.status.outputs.action != 'current'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ steps.status.outputs.action }}
          VERSION: ${{ steps.status.outputs.version }}
          BUILD: ${{ steps.status.outputs.build }}
          FEED_SHA256: ${{ steps.status.outputs.feed_sha256 }}
          TRUSTED_REBUILD_ENABLED: ${{ vars.TRUSTED_REBUILD_ENABLED }}
        run: |
          set -euo pipefail
          gh label create upstream-update \
            --repo "${GITHUB_REPOSITORY}" \
            --color d93f0b \
            --description "Official Codex feed requires reviewed packaging action" \
            --force
          title="[upstream] Codex ${VERSION} build ${BUILD}"
          body_file="${RUNNER_TEMP}/upstream-issue.md"
          {
            printf 'The hourly exact-origin HTTPS feed monitor reports `%s`.\n\n' "${ACTION}"
            printf -- '- Version: `%s`\n' "${VERSION}"
            printf -- '- Build: `%s`\n' "${BUILD}"
            printf -- '- Feed SHA-256: `%s`\n' "${FEED_SHA256}"
            printf -- '- Trusted rebuild enabled: `%s`\n\n' \
              "${TRUSTED_REBUILD_ENABLED:-false}"
            if [[ "${ACTION}" == "review_contract_update" ]]; then
              printf '%s\n' \
                'Authenticate the new source, reconcile every independently pinned contract, prepare the trusted cache, and merge the reviewed contract update. The feed cannot authorize its own dependencies.'
            else
              printf '%s\n' \
                'The reviewed contract is current and the recorded candidate is stale. The isolated trusted-runner rebuild is the permitted next action.'
            fi
            printf '\n%s\n' \
              'This issue is monitoring evidence only. It does not grant redistribution, trademark, signing, or publication approval.'
          } >"${body_file}"
          issue_number="$(
            gh issue list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --label upstream-update \
              --json number,title \
              --jq ".[] | select(.title == \"${title}\") | .number" |
              head -n 1
          )"
          if [[ -n "${issue_number}" ]]; then
            gh issue edit "${issue_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --body-file "${body_file}"
          else
            gh issue create \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${title}" \
              --body-file "${body_file}" \
              --label upstream-update
          fi

      - name: Close resolved upstream issues
        if: steps.status.outputs.action == 'current'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue list \
            --repo "${GITHUB_REPOSITORY}" \
            --state open \
            --label upstream-update \
            --json number \
            --jq '.[].number' |
          while IFS= read -r issue_number; do
            [[ -z "${issue_number}" ]] && continue
            gh issue close "${issue_number}" \
              --repo "${GITHUB_REPOSITORY}" \
              --comment "Resolved: feed, reviewed contract, and recorded engineering candidate now agree."
          done

      - name: Dispatch the isolated trusted rebuild
        if: >-
          steps.status.outputs.action == 'rebuild_candidate' &&
          vars.TRUSTED_REBUILD_ENABLED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.status.outputs.version }}
          BUILD: ${{ steps.status.outputs.build }}
        run: |
          set -euo pipefail
          active="$(
            gh run list \
              --repo "${GITHUB_REPOSITORY}" \
              --workflow rebuild-candidate.yml \
              --limit 30 \
              --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")] | length'
          )"
          open_candidate_prs="$(
            gh pr list \
              --repo "${GITHUB_REPOSITORY}" \
              --state open \
              --label engineering-candidate \
              --json number \
              --jq 'length'
          )"
          if [[ "${active}" == "0" && "${open_candidate_prs}" == "0" ]]; then
            gh workflow run rebuild-candidate.yml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${GITHUB_REF_NAME}" \
              --field "version=${VERSION}" \
              --field "build=${BUILD}"
          fi
