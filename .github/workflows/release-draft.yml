name: Publish protected automatic engineering release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact reviewed Codex application version
        required: true
        type: string
      build:
        description: Exact reviewed Codex application build
        required: true
        type: string
      source_commit:
        description: Exact candidate source commit
        required: true
        type: string
      candidate_generation:
        description: Retained candidate generation basename
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: codex-automatic-release-pipeline
  cancel-in-progress: false

env:
  CARGO_NET_OFFLINE: "true"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"
  PACKAGER_OUTPUT_ROOT: ${{ vars.PACKAGER_OUTPUT_ROOT }}
  PACKAGER_CARGO_DENY: ${{ vars.PACKAGER_CARGO_DENY }}
  PACKAGER_CARGO_DENY_SHA256: ${{ vars.PACKAGER_CARGO_DENY_SHA256 }}

jobs:
  sign:
    name: Sign and retain release evidence
    runs-on: [self-hosted, linux, x64, codex-packager-trusted]
    environment: release-signing
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the exact retained candidate
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD: ${{ inputs.build }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_GENERATION: ${{ inputs.candidate_generation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTOMATIC_RELEASE_ENABLED: ${{ vars.AUTOMATIC_RELEASE_ENABLED }}
        run: |
          set -euo pipefail
          [[ "${AUTOMATIC_RELEASE_ENABLED}" == "true" ]]
          [[ "${REQUESTED_VERSION}" =~ ^[0-9]+([.][0-9]+)+$ ]]
          [[ "${REQUESTED_BUILD}" =~ ^[0-9]+$ ]]
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CANDIDATE_GENERATION}" =~ ^candidate-[0-9]+([.][0-9]+)+-[0-9]+-run-[0-9]+-[0-9]+$ ]]
          [[ "${CANDIDATE_GENERATION}" == "candidate-${REQUESTED_VERSION}-${REQUESTED_BUILD}-run-"* ]]
          [[ "${PACKAGER_OUTPUT_ROOT}" == /* ]]
          [[ "${PACKAGER_CARGO_DENY}" == /* ]]
          [[ "${PACKAGER_CARGO_DENY_SHA256}" =~ ^[0-9a-f]{64}$ ]]
          [[ -d "${PACKAGER_OUTPUT_ROOT}" ]]
          [[ ! -L "${PACKAGER_OUTPUT_ROOT}" ]]
          [[ -f "${PACKAGER_CARGO_DENY}" ]]
          [[ ! -L "${PACKAGER_CARGO_DENY}" ]]
          [[ "$(sha256sum "${PACKAGER_CARGO_DENY}" | cut -d ' ' -f 1)" == "${PACKAGER_CARGO_DENY_SHA256}" ]]
          jq -e \
            --arg version "${REQUESTED_VERSION}" \
            --arg build "${REQUESTED_BUILD}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            '
              .schema == 1 and
              .producer == "io.github.bearhuddleston.codex-linux-packager.rust" and
              .kind == "engineering_candidate_record" and
              .application.version == $version and
              .application.build == $build and
              .source_commit == $source_commit and
              .engineering_candidate == true and
              .automatic_publication_permitted == true and
              .stable_publication_permitted == false and
              .release_status == "automatic_engineering_publication_permitted_not_stable_approval"
            ' data/engineering-candidate.json >/dev/null
          candidate_record="$(jq -c . data/engineering-candidate.json)"
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "${SOURCE_COMMIT}" "origin/${DEFAULT_BRANCH}"
          git switch --detach "${SOURCE_COMMIT}"
          source_tree="$(git rev-parse "${SOURCE_COMMIT}^{tree}")"
          source_epoch="$(git show -s --format=%ct "${SOURCE_COMMIT}")"
          created_at="$(date --utc --date="@${source_epoch}" '+%Y-%m-%dT%H:%M:%SZ')"
          candidate_root="${PACKAGER_OUTPUT_ROOT}/${CANDIDATE_GENERATION}"
          release_root="${candidate_root}/release-draft-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ -d "${candidate_root}" ]]
          [[ ! -L "${candidate_root}" ]]
          for path in \
            "${candidate_root}/appimage/codex-desktop-unofficial-x86_64.AppImage" \
            "${candidate_root}/appimage/provenance.json" \
            "${candidate_root}/evidence/appdir-a.json" \
            "${candidate_root}/evidence/release-readiness.json"
          do
            [[ -f "${path}" ]]
            [[ ! -L "${path}" ]]
          done
          EXPECTED_ARTIFACT_SHA256="$(
            jq -r '.assessment_scope.artifact_sha256' <<<"${candidate_record}"
          )"
          EXPECTED_ARTIFACT_BYTES="$(
            jq -r '.assessment_scope.artifact_bytes' <<<"${candidate_record}"
          )"
          EXPECTED_APPDIR_SHA256="$(
            jq -r '.assessment_scope.appdir_manifest_sha256' <<<"${candidate_record}"
          )"
          EXPECTED_PROVENANCE_SHA256="$(
            jq -r '.assessment_scope.appimage_provenance_sha256' <<<"${candidate_record}"
          )"
          EXPECTED_CARGO_LOCK_SHA256="$(
            jq -r '.assessment_scope.cargo_lock_sha256' <<<"${candidate_record}"
          )"
          [[ "$(sha256sum "${candidate_root}/appimage/codex-desktop-unofficial-x86_64.AppImage" | cut -d ' ' -f 1)" == "${EXPECTED_ARTIFACT_SHA256}" ]]
          [[ "$(stat --format=%s "${candidate_root}/appimage/codex-desktop-unofficial-x86_64.AppImage")" == "${EXPECTED_ARTIFACT_BYTES}" ]]
          [[ "$(sha256sum "${candidate_root}/evidence/appdir-a.json" | cut -d ' ' -f 1)" == "${EXPECTED_APPDIR_SHA256}" ]]
          [[ "$(sha256sum "${candidate_root}/appimage/provenance.json" | cut -d ' ' -f 1)" == "${EXPECTED_PROVENANCE_SHA256}" ]]
          [[ "$(sha256sum Cargo.lock | cut -d ' ' -f 1)" == "${EXPECTED_CARGO_LOCK_SHA256}" ]]
          jq -e \
            --argjson candidate "${candidate_record}" \
            '
              .schema == 1 and
              .producer == "io.github.bearhuddleston.codex-linux-packager.rust" and
              .kind == "release_readiness_assessment" and
              .assessment_scope == $candidate.assessment_scope and
              .engineering_candidate == true and
              .automatic_publication_permitted == true and
              .stable_publication_permitted == false and
              .release_status == "automatic_engineering_publication_permitted_not_stable_approval"
            ' "${candidate_root}/evidence/release-readiness.json" >/dev/null
          [[ ! -e "${release_root}" ]]
          {
            printf 'PACKAGER_BIN=%s\n' "${GITHUB_WORKSPACE}/target/release/codex-linux-packager"
            printf 'CANDIDATE_ROOT=%s\n' "${candidate_root}"
            printf 'RELEASE_ROOT=%s\n' "${release_root}"
            printf 'SOURCE_TREE=%s\n' "${source_tree}"
            printf 'CREATED_AT=%s\n' "${created_at}"
          } >>"${GITHUB_ENV}"

      - name: Build the exact locked release tooling offline
        run: cargo build --release --locked

      - name: Sign and verify the retained release evidence
        env:
          UPDATE_SIGNING_SEED_BASE64: ${{ secrets.UPDATE_SIGNING_SEED_BASE64 }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          umask 077
          mkdir --mode=0700 -- "${RELEASE_ROOT}"
          mkdir --mode=0700 -- "${RELEASE_ROOT}/assets"
          key_directory="$(
            mktemp --directory --tmpdir="${RUNNER_TEMP}" codex-release-key.XXXXXXXXXX
          )"
          key_path="${key_directory}/release.seed"
          cleanup_key() {
            if [[ -f "${key_path}" && ! -L "${key_path}" ]]; then
              chmod 0600 -- "${key_path}"
              unlink -- "${key_path}"
            fi
            if [[ -d "${key_directory}" && ! -L "${key_directory}" ]]; then
              rmdir -- "${key_directory}"
            fi
          }
          trap cleanup_key EXIT HUP INT TERM
          printf '%s' "${UPDATE_SIGNING_SEED_BASE64}" | base64 --decode >"${key_path}"
          unset UPDATE_SIGNING_SEED_BASE64
          [[ "$(stat --format=%s "${key_path}")" == "32" ]]
          chmod 0600 -- "${key_path}"
          "${PACKAGER_CARGO_DENY}" list --format json --layout crate \
            >"${RELEASE_ROOT}/cargo-deny-licenses.json"
          "${PACKAGER_BIN}" sign-update \
            --appimage "${CANDIDATE_ROOT}/appimage/codex-desktop-unofficial-x86_64.AppImage" \
            --provenance "${CANDIDATE_ROOT}/appimage/provenance.json" \
            --private-key "${key_path}" \
            --source-commit "${SOURCE_COMMIT}" \
            --published-at "${CREATED_AT}" \
            --output "${RELEASE_ROOT}/codex-linux-x86_64-update.json" \
            >"${RELEASE_ROOT}/signing-receipt.json"
          "${PACKAGER_BIN}" prepare-release \
            --appimage "${CANDIDATE_ROOT}/appimage/codex-desktop-unofficial-x86_64.AppImage" \
            --provenance "${CANDIDATE_ROOT}/appimage/provenance.json" \
            --update-manifest "${RELEASE_ROOT}/codex-linux-x86_64-update.json" \
            --release-readiness "${CANDIDATE_ROOT}/evidence/release-readiness.json" \
            --appdir-manifest "${CANDIDATE_ROOT}/evidence/appdir-a.json" \
            --cargo-lock "${GITHUB_WORKSPACE}/Cargo.lock" \
            --cargo-license-report "${RELEASE_ROOT}/cargo-deny-licenses.json" \
            --private-key "${key_path}" \
            --source-commit "${SOURCE_COMMIT}" \
            --source-tree "${SOURCE_TREE}" \
            --created-at "${CREATED_AT}" \
            --output "${RELEASE_ROOT}/evidence" \
            >"${RELEASE_ROOT}/preparation-receipt.json"
          install --mode=0644 -- \
            "${CANDIDATE_ROOT}/evidence/appdir-a.json" \
            "${RELEASE_ROOT}/assets/appdir-manifest.json"
          install --mode=0644 -- \
            "${CANDIDATE_ROOT}/evidence/release-readiness.json" \
            "${RELEASE_ROOT}/assets/release-readiness.json"
          install --mode=0644 -- \
            "${GITHUB_WORKSPACE}/Cargo.lock" \
            "${RELEASE_ROOT}/assets/Cargo.lock"
          "${PACKAGER_BIN}" verify-release \
            --evidence "${RELEASE_ROOT}/evidence" \
            --appimage "${CANDIDATE_ROOT}/appimage/codex-desktop-unofficial-x86_64.AppImage" \
            --provenance "${CANDIDATE_ROOT}/appimage/provenance.json" \
            --update-manifest "${RELEASE_ROOT}/codex-linux-x86_64-update.json" \
            --release-readiness "${RELEASE_ROOT}/assets/release-readiness.json" \
            --appdir-manifest "${RELEASE_ROOT}/assets/appdir-manifest.json" \
            --cargo-lock "${RELEASE_ROOT}/assets/Cargo.lock" \
            --source-commit "${SOURCE_COMMIT}" \
            --source-tree "${SOURCE_TREE}" \
            >"${RELEASE_ROOT}/verification-receipt.json"

      - name: Record the retained signed generation
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD: ${{ inputs.build }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          {
            printf '### Protected release signing\n\n'
            printf -- '- Application: `%s` build `%s`\n' \
              "${REQUESTED_VERSION}" "${REQUESTED_BUILD}"
            printf -- '- Source commit: `%s`\n' "${SOURCE_COMMIT}"
            printf -- '- Retained release root: `%s`\n' "${RELEASE_ROOT}"
            printf -- '- Signing key persisted by workflow: `no`\n'
            printf -- '- Repository write authority in signing job: `no`\n'
          } >>"${GITHUB_STEP_SUMMARY}"

  tag:
    name: Create the exact signed-candidate tag
    needs: sign
    runs-on: ubuntu-24.04
    environment: automation-commit
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out with the scoped tag key
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true
          ssh-key: ${{ secrets.AUTOMATION_DEPLOY_KEY }}

      - name: Create or verify the exact release tag
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD: ${{ inputs.build }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "${REQUESTED_VERSION}" =~ ^[0-9]+([.][0-9]+)+$ ]]
          [[ "${REQUESTED_BUILD}" =~ ^[0-9]+$ ]]
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git merge-base --is-ancestor "${SOURCE_COMMIT}" "origin/${GITHUB_REF_NAME}"
          jq -e \
            --arg version "${REQUESTED_VERSION}" \
            --arg build "${REQUESTED_BUILD}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            '
              .schema == 1 and
              .producer == "io.github.bearhuddleston.codex-linux-packager.rust" and
              .kind == "engineering_candidate_record" and
              .application.version == $version and
              .application.build == $build and
              .source_commit == $source_commit and
              .engineering_candidate == true and
              .automatic_publication_permitted == true and
              .stable_publication_permitted == false
            ' data/engineering-candidate.json >/dev/null
          RELEASE_TAG="codex-app-${REQUESTED_VERSION}-${REQUESTED_BUILD}"
          mapfile -t remote_tags < <(
            git ls-remote --refs origin "refs/tags/${RELEASE_TAG}"
          )
          if [[ "${#remote_tags[@]}" == 0 ]]; then
            git tag "${RELEASE_TAG}" "${SOURCE_COMMIT}"
            git push origin "refs/tags/${RELEASE_TAG}"
            mapfile -t remote_tags < <(
              git ls-remote --refs origin "refs/tags/${RELEASE_TAG}"
            )
          fi
          [[ "${#remote_tags[@]}" == 1 ]]
          read -r remote_target remote_ref <<<"${remote_tags[0]}"
          [[ "${remote_ref}" == "refs/tags/${RELEASE_TAG}" ]]
          [[ "${remote_target}" == "${SOURCE_COMMIT}" ]]

  draft:
    name: Create and redownload the public engineering release
    needs: [sign, tag]
    runs-on: [self-hosted, linux, x64, codex-packager-trusted]
    environment: release-draft
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out the default branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the signed handoff
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD: ${{ inputs.build }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CANDIDATE_GENERATION: ${{ inputs.candidate_generation }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${CANDIDATE_GENERATION}" == "candidate-${REQUESTED_VERSION}-${REQUESTED_BUILD}-run-"* ]]
          git cat-file -e "${SOURCE_COMMIT}^{commit}"
          git switch --detach "${SOURCE_COMMIT}"
          source_tree="$(git rev-parse "${SOURCE_COMMIT}^{tree}")"
          candidate_root="${PACKAGER_OUTPUT_ROOT}/${CANDIDATE_GENERATION}"
          release_root="${candidate_root}/release-draft-run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          [[ -d "${candidate_root}" && ! -L "${candidate_root}" ]]
          [[ -d "${release_root}" && ! -L "${release_root}" ]]
          {
            printf 'PACKAGER_BIN=%s\n' "${GITHUB_WORKSPACE}/target/release/codex-linux-packager"
            printf 'CANDIDATE_ROOT=%s\n' "${candidate_root}"
            printf 'RELEASE_ROOT=%s\n' "${release_root}"
            printf 'SOURCE_TREE=%s\n' "${source_tree}"
            printf 'RELEASE_TAG=codex-app-%s-%s\n' "${REQUESTED_VERSION}" "${REQUESTED_BUILD}"
          } >>"${GITHUB_ENV}"

      - name: Build the exact locked verifier offline
        run: cargo build --release --locked

      - name: Keylessly verify the local handoff
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          "${PACKAGER_BIN}" verify-release \
            --evidence "${RELEASE_ROOT}/evidence" \
            --appimage "${CANDIDATE_ROOT}/appimage/codex-desktop-unofficial-x86_64.AppImage" \
            --provenance "${CANDIDATE_ROOT}/appimage/provenance.json" \
            --update-manifest "${RELEASE_ROOT}/codex-linux-x86_64-update.json" \
            --release-readiness "${RELEASE_ROOT}/assets/release-readiness.json" \
            --appdir-manifest "${RELEASE_ROOT}/assets/appdir-manifest.json" \
            --cargo-lock "${RELEASE_ROOT}/assets/Cargo.lock" \
            --source-commit "${SOURCE_COMMIT}" \
            --source-tree "${SOURCE_TREE}" \
            >"${RELEASE_ROOT}/draft-preflight-receipt.json"

      - name: Create the private engineering release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          REQUESTED_VERSION: ${{ inputs.version }}
          REQUESTED_BUILD: ${{ inputs.build }}
        run: |
          set -euo pipefail
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "release tag already exists; refusing replacement" >&2
            exit 1
          fi
          tag_ref="$(
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}"
          )"
          jq -e \
            --arg tag_ref "refs/tags/${RELEASE_TAG}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            '
              .ref == $tag_ref and
              .object.type == "commit" and
              .object.sha == $source_commit
            ' <<<"${tag_ref}" >/dev/null
          notes="${RUNNER_TEMP}/automatic-release-notes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.md"
          {
            printf '# Unofficial automatic Linux engineering release\n\n'
            printf 'Codex application `%s` build `%s`.\n\n' \
              "${REQUESTED_VERSION}" "${REQUESTED_BUILD}"
            printf 'This public build is unofficial and unaffiliated with OpenAI. '
            printf 'It passed the repository authentication, native ABI, reproducibility, '
            printf 'ELF, older-glibc, Wayland, and X11 engineering checks. '
            printf 'It is not a claim of stable support or OpenAI endorsement.\n\n'
            printf 'Source commit: `%s`\n' "${SOURCE_COMMIT}"
          } >"${notes}"
          release_request="$(
            jq -n \
              --arg tag "${RELEASE_TAG}" \
              --arg target "${SOURCE_COMMIT}" \
              --arg name \
                "Codex Desktop Linux ${REQUESTED_VERSION}-${REQUESTED_BUILD} (unofficial)" \
              --rawfile body "${notes}" \
              '{
                tag_name: $tag,
                target_commitish: $target,
                name: $name,
                body: $body,
                draft: true,
                prerelease: false
              }'
          )"
          release_json="$(
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/releases" \
              --input - <<<"${release_request}"
          )"
          jq -e \
            --arg tag "${RELEASE_TAG}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            '
              (.id | type == "number") and
              .tag_name == $tag and
              .target_commitish == $source_commit and
              .draft == true and
              .prerelease == false and
              (.assets | length) == 0
            ' <<<"${release_json}" >/dev/null
          RELEASE_ID="$(jq -r '.id' <<<"${release_json}")"
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]]
          printf 'RELEASE_ID=%s\n' "${RELEASE_ID}" >>"${GITHUB_ENV}"
          gh release upload "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            "${CANDIDATE_ROOT}/appimage/codex-desktop-unofficial-x86_64.AppImage" \
            "${CANDIDATE_ROOT}/appimage/provenance.json" \
            "${RELEASE_ROOT}/codex-linux-x86_64-update.json" \
            "${RELEASE_ROOT}/assets/appdir-manifest.json" \
            "${RELEASE_ROOT}/assets/release-readiness.json" \
            "${RELEASE_ROOT}/assets/Cargo.lock" \
            "${RELEASE_ROOT}/evidence/SHA256SUMS" \
            "${RELEASE_ROOT}/evidence/codex-linux-x86_64.spdx.json" \
            "${RELEASE_ROOT}/evidence/release-attestation.json" \
            "${RELEASE_ROOT}/evidence/third-party-notices.json"
          release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          )"
          jq -e \
            --argjson release_id "${RELEASE_ID}" \
            --arg tag "${RELEASE_TAG}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            '
              .id == $release_id and
              .tag_name == $tag and
              .target_commitish == $source_commit and
              .draft == true and
              .prerelease == false and
              ((.assets | map(.name) | sort) == [
                "Cargo.lock",
                "SHA256SUMS",
                "appdir-manifest.json",
                "codex-desktop-unofficial-x86_64.AppImage",
                "codex-linux-x86_64-update.json",
                "codex-linux-x86_64.spdx.json",
                "provenance.json",
                "release-attestation.json",
                "release-readiness.json",
                "third-party-notices.json"
              ])
            ' <<<"${release_json}" >/dev/null

      - name: Redownload and keylessly verify every private asset
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          download="${RUNNER_TEMP}/release-download-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          evidence="${download}/evidence"
          mkdir --mode=0700 -- "${download}"
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --dir "${download}"
          release_inventory="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json isDraft,isPrerelease,assets \
              --jq '
                (.isDraft == true) and
                (.isPrerelease == false) and
                ((.assets | map(.name) | sort) == [
                  "Cargo.lock",
                  "SHA256SUMS",
                  "appdir-manifest.json",
                  "codex-desktop-unofficial-x86_64.AppImage",
                  "codex-linux-x86_64-update.json",
                  "codex-linux-x86_64.spdx.json",
                  "provenance.json",
                  "release-attestation.json",
                  "release-readiness.json",
                  "third-party-notices.json"
                ])
              '
          )"
          [[ "${release_inventory}" == "true" ]]
          mapfile -t downloaded_assets < <(
            find "${download}" -mindepth 1 -maxdepth 1 -printf '%f\n' |
              LC_ALL=C sort
          )
          expected_assets=(
            Cargo.lock
            SHA256SUMS
            appdir-manifest.json
            codex-desktop-unofficial-x86_64.AppImage
            codex-linux-x86_64-update.json
            codex-linux-x86_64.spdx.json
            provenance.json
            release-attestation.json
            release-readiness.json
            third-party-notices.json
          )
          [[ "${#downloaded_assets[@]}" == "${#expected_assets[@]}" ]]
          for index in "${!expected_assets[@]}"; do
            [[ "${downloaded_assets[index]}" == "${expected_assets[index]}" ]]
            [[ -f "${download}/${downloaded_assets[index]}" ]]
            [[ ! -L "${download}/${downloaded_assets[index]}" ]]
          done
          chmod 0755 -- "${download}/codex-desktop-unofficial-x86_64.AppImage"
          [[ "$(
            stat --format=%a \
              "${download}/codex-desktop-unofficial-x86_64.AppImage"
          )" == "755" ]]
          mkdir --mode=0755 -- "${evidence}"
          for name in \
            SHA256SUMS \
            codex-linux-x86_64.spdx.json \
            release-attestation.json \
            third-party-notices.json
          do
            install --mode=0644 -- "${download}/${name}" "${evidence}/${name}"
          done
          "${PACKAGER_BIN}" verify-release \
            --evidence "${evidence}" \
            --appimage "${download}/codex-desktop-unofficial-x86_64.AppImage" \
            --provenance "${download}/provenance.json" \
            --update-manifest "${download}/codex-linux-x86_64-update.json" \
            --release-readiness "${download}/release-readiness.json" \
            --appdir-manifest "${download}/appdir-manifest.json" \
            --cargo-lock "${download}/Cargo.lock" \
            --source-commit "${SOURCE_COMMIT}" \
            --source-tree "${SOURCE_TREE}" \
            >"${RELEASE_ROOT}/draft-redownload-verification.json"

      - name: Publish the verified engineering release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft=false \
            --latest
          published_release="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json databaseId,tagName,targetCommitish,isDraft,isPrerelease,assets
          )"
          jq -e \
            --argjson release_id "${RELEASE_ID}" \
            --arg tag "${RELEASE_TAG}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            '
              .databaseId == $release_id and
              .tagName == $tag and
              .targetCommitish == $source_commit and
              .isDraft == false and
              .isPrerelease == false and
              ((.assets | map(.name) | sort) == [
                "Cargo.lock",
                "SHA256SUMS",
                "appdir-manifest.json",
                "codex-desktop-unofficial-x86_64.AppImage",
                "codex-linux-x86_64-update.json",
                "codex-linux-x86_64.spdx.json",
                "provenance.json",
                "release-attestation.json",
                "release-readiness.json",
                "third-party-notices.json"
              ])
            ' <<<"${published_release}" >/dev/null
          {
            printf '### Public automatic engineering release verification\n\n'
            printf -- '- Release tag: `%s`\n' "${RELEASE_TAG}"
            printf -- '- Redownloaded asset verification: `passed`\n'
            printf -- '- Public visibility: `public latest release`\n'
            printf -- '- Stable support claim: `not made`\n'
          } >>"${GITHUB_STEP_SUMMARY}"

      - name: Remove the exact uncommitted private release on failure
        if: ${{ failure() && env.RELEASE_ID != '' }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GITHUB_TOKEN }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]]
          release_json="$(
            gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          )"
          if ! jq -e \
            --argjson release_id "${RELEASE_ID}" \
            --arg tag "${RELEASE_TAG}" \
            --arg source_commit "${SOURCE_COMMIT}" \
            '
              .id == $release_id and
              .tag_name == $tag and
              .target_commitish == $source_commit and
              .draft == true and
              .prerelease == false
            ' <<<"${release_json}" >/dev/null
          then
            echo "release reached its public commit boundary; refusing cleanup" >&2
            exit 0
          fi
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          {
            printf '### Failed private release cleanup\n\n'
            printf -- '- Release id: `%s`\n' "${RELEASE_ID}"
            printf -- '- Public release deleted: `no`\n'
            printf -- '- Source tag deleted: `no`\n'
          } >>"${GITHUB_STEP_SUMMARY}"
