[package]
name = "codex-linux-packager"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Auditable Linux x86_64 packaging CLI for authenticated Codex desktop artifacts"
license = "MIT"
repository = "https://github.com/BearHuddleston/codex-linux-packager"
publish = false

[dependencies]
anyhow = "=1.0.104"
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
clap = { version = "=4.5.54", features = ["derive"] }
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["fast"] }
flate2 = { version = "=1.1.9", default-features = false, features = ["zlib-rs"] }
quick-xml = "=0.41.0"
rustix = { version = "=1.1.4", features = ["fs", "process", "rand"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
thiserror = "=2.0.17"
tar = { version = "=0.4.46", default-features = false }
ureq = { version = "=3.3.0", default-features = false, features = ["rustls"] }
zip = { version = "=6.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "=3.27.0"

[lib]
name = "codex_linux_packager"
path = "src/lib.rs"

[[bin]]
name = "codex-linux-packager"
path = "src/main.rs"

[[bin]]
name = "codex-linux-updater"
path = "src/bin/codex-linux-updater.rs"

[lints.rust]
unsafe_code = "forbid"
